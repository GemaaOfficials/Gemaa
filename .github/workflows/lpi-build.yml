name: Build LPI City Money

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/lpi-city-money/**"
      - ".github/workflows/lpi-build.yml"
  pull_request:
    paths:
      - "apps/lpi-city-money/**"
      - ".github/workflows/lpi-build.yml"

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows EXE installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app build dependencies
        working-directory: apps/lpi-city-money
        run: npm install
      - name: Build Windows installer
        working-directory: apps/lpi-city-money
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LPI-Windows-EXE
          path: apps/lpi-city-money/release/*.exe
          if-no-files-found: error

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install app build dependencies
        working-directory: apps/lpi-city-money
        run: npm install
      - name: Generate Android wrapper
        working-directory: apps/lpi-city-money
        run: npm run android:setup
      - name: Build debug APK
        working-directory: apps/lpi-city-money/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LPI-Android-APK
          path: apps/lpi-city-money/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error