name: Build Remim installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-source-tree:
    name: Publish unpacked source files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild archive from bootstrap parts if needed
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f Remim-source.zip ]]; then
            cat .remim-parts/part*.bin > Remim-source.zip
          fi
      - name: Expand source archive into repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q Remim-source.zip -d extracted
          cp -a extracted/Remim/. .
          rm -rf extracted .remim-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish Remim source tree [skip ci]"
            git push
          else
            echo "Source tree is already unpacked."
          fi

  android-apk:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild archive from bootstrap parts if needed
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f Remim-source.zip ]]; then
            cat .remim-parts/part*.bin > Remim-source.zip
          fi
      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q Remim-source.zip -d extracted
          echo "REMIM_SOURCE_DIR=$GITHUB_WORKSPACE/extracted/Remim" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/remim_android"
          flutter create --platforms=android --org com.remim --project-name remim "$BUILD_DIR"
          cp "$REMIM_SOURCE_DIR/apps/android/pubspec.yaml" "$BUILD_DIR/pubspec.yaml"
          rm -rf "$BUILD_DIR/lib"
          cp -R "$REMIM_SOURCE_DIR/apps/android/lib" "$BUILD_DIR/lib"
          cp "$REMIM_SOURCE_DIR/apps/android/platform/AndroidManifest.xml" "$BUILD_DIR/android/app/src/main/AndroidManifest.xml"
          mkdir -p "$BUILD_DIR/android/app/src/main/kotlin/com/remim/remim"
          cp "$REMIM_SOURCE_DIR/apps/android/platform/MainActivity.kt" "$BUILD_DIR/android/app/src/main/kotlin/com/remim/remim/MainActivity.kt"
      - name: Build APK
        working-directory: ${{ runner.temp }}/remim_android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter pub get
          flutter build apk --release --dart-define="SUPABASE_URL=${SUPABASE_URL}" --dart-define="SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
      - uses: actions/upload-artifact@v4
        with:
          name: Remim-Android-APK
          path: ${{ runner.temp }}/remim_android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows x64 NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild archive from bootstrap parts if needed
        shell: pwsh
        run: |
          if (!(Test-Path 'Remim-source.zip')) {
            $parts = Get-ChildItem '.remim-parts/part*.bin' | Sort-Object Name
            $output = [System.IO.File]::Create('Remim-source.zip')
            try {
              foreach ($part in $parts) {
                $bytes = [System.IO.File]::ReadAllBytes($part.FullName)
                $output.Write($bytes, 0, $bytes.Length)
              }
            } finally {
              $output.Dispose()
            }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract source archive
        shell: pwsh
        run: Expand-Archive -Path Remim-source.zip -DestinationPath source
      - name: Install dependencies and build
        working-directory: source/Remim
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm install
          npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Remim-Windows-Installer
          path: source/Remim/release/*.exe
          if-no-files-found: error
          retention-days: 14
